
<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENIX</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="robot">
        <h1>🤖 ZENIX</h1>

        <div class="face">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="mouth"></div>
        </div>

        <h2>Բարև՛, ես ZENIX-ն եմ։</h2>
        <p>Քո հայկական խելացի օգնականը ❤️</p>

        <div class="chat">
           <div id="messages">ZENIX: Ես պատրաստ եմ։</div>

<button type="button" id="newChatButton">
    + Նոր զրույց
</button>

<input id="userInput" placeholder="Գրիր ինձ..." />

<button type="button" onclick="sendMessage()">
    Ուղարկել
</button>
<button type="button" id="voiceButton">
    🎙️ Խոսել ZENIX-ի հետ
</button>
        </div>
    </div>
<script src="code.js" defer></script>
</body>
</html>
